name: Build Cosmetics Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # ручной запуск из вкладки Actions

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build with Maven (Java 21)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      - name: Verify JAR exists
        run: ls -la target/Cosmetics-1.0.0.jar

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cosmetics-Plugin
          path: target/Cosmetics-1.0.0.jar
          retention-days: 30

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/Cosmetics-1.0.0.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}